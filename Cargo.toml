[package]
name = "evalify-kiosk"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
warp = "0.3"
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
zeroize = "1.7"
anyhow = "1.0"
bytes = "1"
which = "4"
