[package]
name = "evalify-kiosk"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
warp = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = "8"
aes-gcm = "0.10"
aead = "0.5"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"
zeroize = "1.5"
which = "4"
anyhow = "1.0"



